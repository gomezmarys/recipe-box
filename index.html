<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Irie Seoul Recipe Box</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="container py-5">
      <section>
        <h2>Find a Recipe</h2>
        <input type="number" id="recipe-id" />
        <button id="get-btn" class="btn btn-dark">Find Recipe</button>
        <p id="status"></p>
        <div id="recipe"></div>
      </section>

      <section>
        <h2>Add a Dish</h2>
        <input type="text" id="dish-name" />
        <button class="btn btn-success" id="post-btn">Add Dish</button>
        <p id="post-status"></p>
        <div id="saved"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
